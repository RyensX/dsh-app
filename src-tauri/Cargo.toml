[package]
name = "dsh-app"
version = "1.0.0"
description = "Desktop carrier for DeepSeek Harness"
authors = ["DSH App contributors"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dsh_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "dsh-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[features]
default = []
bundled = []
lite = [
  "dep:tauri-plugin-dialog",
  "dep:ureq",
  "dep:sha2",
  "dep:flate2",
  "dep:tar",
  "dep:zip",
]

[dependencies]
command-group = "5.0.1"
open = "5.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = { version = "2.7.2", optional = true }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-window-state = "2.4.1"
node-semver = "2.2.0"
ureq = { version = "2.12.1", optional = true }
sha2 = { version = "0.10.9", optional = true }
flate2 = { version = "1.1.2", optional = true }
tar = { version = "0.4.44", optional = true }
zip = { version = "2.2.2", default-features = false, features = ["deflate"], optional = true }

[dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "NSEvent", "NSResponder", "NSWindow"] }
