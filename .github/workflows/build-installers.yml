name: Build installers

on:
  push:
  workflow_dispatch:
    inputs:
      formal:
        description: Require signing and notarization credentials
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            edition: bundled
            platform: macos
            arch: arm64
            extension: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            edition: bundled
            platform: macos
            arch: x64
            extension: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            edition: bundled
            platform: windows
            arch: x64
            extension: exe
          - runner: macos-15
            target: aarch64-apple-darwin
            edition: lite
            platform: macos
            arch: arm64
            extension: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            edition: lite
            platform: macos
            arch: x64
            extension: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            edition: lite
            platform: windows
            arch: x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    env:
      FORMAL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.formal || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install application dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile
      - name: Import Windows signing certificate
        if: env.FORMAL_BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD -or !$env:WINDOWS_TIMESTAMP_URL) { throw 'Windows signing secrets are incomplete' }
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          $pfx = Join-Path $env:RUNNER_TEMP 'dsh-app-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $env:WINDOWS_TIMESTAMP_URL } } } | ConvertTo-Json -Depth 6 | Set-Content .build/windows-signing.json
      - name: Build unsigned macOS installer
        if: runner.os == 'macOS' && env.FORMAL_BUILD != 'true'
        run: node scripts/build-app.mjs --edition ${{ matrix.edition }} --target ${{ matrix.target }} --formal false
      - name: Build signed macOS installer
        if: runner.os == 'macOS' && env.FORMAL_BUILD == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-app.mjs --edition ${{ matrix.edition }} --target ${{ matrix.target }} --formal true
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $formal = $env:FORMAL_BUILD.ToLowerInvariant()
          $arguments = @('scripts/build-app.mjs', '--edition', '${{ matrix.edition }}', '--target', '${{ matrix.target }}', '--formal', $formal)
          if ($formal -eq 'true') { $arguments += @('--signing-config', '.build/windows-signing.json') }
          node @arguments
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-app-${{ matrix.edition }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: .build/installers/dsh-app-${{ matrix.edition }}-*-${{ matrix.platform }}-${{ matrix.arch }}.${{ matrix.extension }}
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Update pre-release
    needs: build
    # 任一 matrix 失败时仍发布其余已成功生成并上传的安装包。
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: latest-commit-pre-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: latest-commit-pre-release
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check build freshness
        id: freshness
        shell: bash
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name | startswith("dsh-app-"))] | length')"
            if (( artifact_count == 0 )); then
              echo "No installer artifacts were produced by this run; keeping the existing pre-release unchanged."
              exit 0
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale build ${GITHUB_SHA}; ${DEFAULT_BRANCH} is now at ${latest_sha}."
          fi
      - name: Download installer artifacts
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-app-*
          path: release-assets
          merge-multiple: true
      - name: Replace pre-release
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo 'No installer artifacts were downloaded for this run; keeping the existing pre-release unchanged.'
            exit 0
          fi

          notes_file="${RUNNER_TEMP}/pre-release-notes.md"
          commit_message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.message)"
          short_sha="${GITHUB_SHA:0:7}"
          {
            printf '## 最新提交构建\n\n'
            printf '| 构建信息 | 详情 |\n'
            printf '| --- | --- |\n'
            printf '| 提交 | [`%s`](%s/%s/commit/%s) |\n' \
              "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| 工作流 | [运行 #%s · 尝试 %s](%s/%s/actions/runs/%s) |\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| 安装包 | 成功生成 %s 个 |\n\n' "${#assets[@]}"
            printf '### 提交说明\n\n'
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '> %s\n' "$line"
            done <<< "$commit_message"
            printf '\n### 构建产物\n\n'
            printf '> [!WARNING]\n'
            printf '> 这是根据最新提交自动生成的构建版本，可能不稳定、功能不完整，或包含已知及未知问题。'
            printf '请谨慎使用，不要将其用于生产环境或其他关键工作。\n\n'
            printf '%s\n\n' '---'
            printf '## Latest commit build\n\n'
            printf '| Build | Details |\n'
            printf '| --- | --- |\n'
            printf '| Commit | [`%s`](%s/%s/commit/%s) |\n' \
              "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| Workflow | [Run #%s · attempt %s](%s/%s/actions/runs/%s) |\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| Installers | %s successfully produced |\n\n' "${#assets[@]}"
            printf '### Commit message\n\n'
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '> %s\n' "$line"
            done <<< "$commit_message"
            printf '\n### Artifacts\n\n'
            printf '> [!WARNING]\n'
            printf '> This is an automatically generated build from the latest commit. '
            printf 'It may be unstable, incomplete, or contain known or unknown issues. '
            printf 'Use it with caution, and do not rely on it for production or other critical work.\n'
          } > "$notes_file"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2>&1; then
            # 上次发布中断时可能只留下 tag；删除它以确保新 tag 指向本次提交。
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}"
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "latest-commit-pre-release" \
            --notes-file "$notes_file" \
            --prerelease \
            --latest=false
