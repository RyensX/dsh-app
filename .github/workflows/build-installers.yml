name: Build installers

on:
  push:
  workflow_dispatch:
    inputs:
      formal:
        description: Require signing and notarization credentials
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            edition: bundled
            platform: macos
            arch: arm64
            extension: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            edition: bundled
            platform: macos
            arch: x64
            extension: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            edition: bundled
            platform: windows
            arch: x64
            extension: exe
          - runner: macos-15
            target: aarch64-apple-darwin
            edition: lite
            platform: macos
            arch: arm64
            extension: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            edition: lite
            platform: macos
            arch: x64
            extension: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            edition: lite
            platform: windows
            arch: x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    env:
      FORMAL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.formal || false }}
      PRE_RELEASE_SUFFIX: debug
      PRE_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install application dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile
      - name: Import Windows signing certificate
        if: env.FORMAL_BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD -or !$env:WINDOWS_TIMESTAMP_URL) { throw 'Windows signing secrets are incomplete' }
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          $pfx = Join-Path $env:RUNNER_TEMP 'dsh-app-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $env:WINDOWS_TIMESTAMP_URL } } } | ConvertTo-Json -Depth 6 | Set-Content .build/windows-signing.json
      - name: Build unsigned macOS installer
        if: runner.os == 'macOS' && env.FORMAL_BUILD != 'true'
        run: node scripts/build-app.mjs --edition ${{ matrix.edition }} --target ${{ matrix.target }} --formal false --artifact-suffix "$PRE_RELEASE_SUFFIX" --artifact-commit "$PRE_RELEASE_COMMIT"
      - name: Build signed macOS installer
        if: runner.os == 'macOS' && env.FORMAL_BUILD == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-app.mjs --edition ${{ matrix.edition }} --target ${{ matrix.target }} --formal true --artifact-suffix "$PRE_RELEASE_SUFFIX" --artifact-commit "$PRE_RELEASE_COMMIT"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $formal = $env:FORMAL_BUILD.ToLowerInvariant()
          $arguments = @(
            'scripts/build-app.mjs',
            '--edition', '${{ matrix.edition }}',
            '--target', '${{ matrix.target }}',
            '--formal', $formal,
            '--artifact-suffix', $env:PRE_RELEASE_SUFFIX,
            '--artifact-commit', $env:PRE_RELEASE_COMMIT
          )
          if ($formal -eq 'true') { $arguments += @('--signing-config', '.build/windows-signing.json') }
          node @arguments
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem .build/installers -Filter 'dsh-app-${{ matrix.edition }}-*-windows-${{ matrix.arch }}_debug_*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Built Windows installer was not found' }
          node scripts/test-windows-installer.mjs --edition '${{ matrix.edition }}' --path $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-app-${{ matrix.edition }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: .build/installers/dsh-app-${{ matrix.edition }}-*-${{ matrix.platform }}-${{ matrix.arch }}_debug_*.${{ matrix.extension }}
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Update pre-release
    needs: build
    # 任一 matrix 失败时仍发布其余已成功生成并上传的安装包。
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: latest-commit-pre-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: latest-commit-pre-release
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check build freshness
        id: freshness
        shell: bash
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name | startswith("dsh-app-"))] | length')"
            if (( artifact_count == 0 )); then
              echo "No installer artifacts were produced by this run; keeping the existing pre-release unchanged."
              exit 0
            fi
            echo "artifact_count=${artifact_count}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale build ${GITHUB_SHA}; ${DEFAULT_BRANCH} is now at ${latest_sha}."
          fi
      - name: Download installer artifacts
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-app-*
          path: release-assets
          merge-multiple: true
      - name: Replace pre-release
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          expected_asset_count="${{ steps.freshness.outputs.artifact_count }}"
          if [[ ! "$expected_asset_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid expected installer artifact count: ${expected_asset_count}"
            exit 1
          fi
          if (( ${#assets[@]} != expected_asset_count )); then
            echo "::error::Expected ${expected_asset_count} downloaded installers, found ${#assets[@]}."
            exit 1
          fi

          declare -A current_asset_sizes=()
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || ! -s "$asset" ]]; then
              echo "::error::Installer artifact is missing or empty: ${asset}"
              exit 1
            fi
            asset_name="$(basename "$asset")"
            if [[ -n "${current_asset_sizes[$asset_name]+present}" ]]; then
              echo "::error::Duplicate installer artifact name: ${asset_name}"
              exit 1
            fi
            current_asset_sizes["$asset_name"]="$(stat --format='%s' "$asset")"
          done

          notes_file="${RUNNER_TEMP}/pre-release-notes.md"
          commit_message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.message)"
          short_sha="${GITHUB_SHA:0:7}"
          {
            printf '## 最新提交构建\n\n'
            printf '| 构建信息 | 详情 |\n'
            printf '| --- | --- |\n'
            printf '| 提交 | [`%s`](%s/%s/commit/%s) |\n' \
              "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| 工作流 | [运行 #%s · 尝试 %s](%s/%s/actions/runs/%s) |\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| 安装包 | 成功生成 %s 个 |\n\n' "${#assets[@]}"
            printf '### 提交说明\n\n'
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '> %s\n' "$line"
            done <<< "$commit_message"
            printf '\n### 构建产物\n\n'
            printf '> [!WARNING]\n'
            printf '> 这是根据最新提交自动生成的构建版本，可能不稳定、功能不完整，或包含已知及未知问题。'
            printf '请谨慎使用，不要将其用于生产环境或其他关键工作。\n\n'
            printf 'macOS 用户首次启动前请阅读 [macOS 首次启动授权指南](%s/%s/blob/%s/docs/macos-installation.zh.md)。\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '%s\n\n' '---'
            printf '## Latest commit build\n\n'
            printf '| Build | Details |\n'
            printf '| --- | --- |\n'
            printf '| Commit | [`%s`](%s/%s/commit/%s) |\n' \
              "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| Workflow | [Run #%s · attempt %s](%s/%s/actions/runs/%s) |\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| Installers | %s successfully produced |\n\n' "${#assets[@]}"
            printf '### Commit message\n\n'
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '> %s\n' "$line"
            done <<< "$commit_message"
            printf '\n### Artifacts\n\n'
            printf '> [!WARNING]\n'
            printf '> This is an automatically generated build from the latest commit. '
            printf 'It may be unstable, incomplete, or contain known or unknown issues. '
            printf 'Use it with caution, and do not rely on it for production or other critical work.\n\n'
            printf 'Before opening the app for the first time on macOS, read the [macOS first-launch authorization guide](%s/%s/blob/%s/docs/macos-installation.md).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > "$notes_file"

          staging_tag="${RELEASE_TAG}-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          backup_tag="${RELEASE_TAG}-backup-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          tag_ref_endpoint() {
            printf 'repos/%s/git/ref/tags/%s' "$GITHUB_REPOSITORY" "$1"
          }

          tag_refs_endpoint() {
            printf 'repos/%s/git/refs/tags/%s' "$GITHUB_REPOSITORY" "$1"
          }

          ensure_tag_ref() {
            local tag="$1"
            local sha="$2"
            if gh api "$(tag_ref_endpoint "$tag")" > /dev/null 2>&1; then
              gh api --method PATCH "$(tag_refs_endpoint "$tag")" -f sha="$sha" -F force=true > /dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${tag}" \
                -f sha="$sha" > /dev/null
            fi
          }

          delete_tag_ref_if_exists() {
            local tag="$1"
            if gh api "$(tag_ref_endpoint "$tag")" > /dev/null 2>&1; then
              gh api --method DELETE "$(tag_refs_endpoint "$tag")"
            fi
          }

          release_json_for_tag() {
            local tag="$1"
            local releases_json
            releases_json="$(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | jq -sc 'add')"
            jq -c --arg tag "$tag" '[.[] | select(.tag_name == $tag)][0] // empty' \
              <<< "$releases_json"
          }

          wait_for_release_json() {
            local tag="$1"
            local release_json
            local attempt
            for attempt in {1..15}; do
              release_json="$(release_json_for_tag "$tag")"
              if [[ -n "$release_json" ]]; then
                printf '%s\n' "$release_json"
                return 0
              fi
              sleep 1
            done
            echo "::error::Release did not become available: ${tag}" >&2
            return 1
          }

          release_id_for_tag() {
            wait_for_release_json "$1" | jq -r '.id'
          }

          verify_release_assets() {
            local release_id="$1"
            local release_assets_json asset_count asset asset_name asset_size remote_row remote_state remote_size
            release_assets_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
            asset_count="$(jq 'length' <<< "$release_assets_json")"
            if (( asset_count != expected_asset_count )); then
              echo "::error::Expected ${expected_asset_count} release assets, found ${asset_count}."
              return 1
            fi
            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              asset_size="${current_asset_sizes[$asset_name]}"
              remote_row="$(jq -r --arg name "$asset_name" \
                '[.[] | select(.name == $name)] | if length == 1 then [.[0].state, .[0].size] | @tsv else empty end' \
                <<< "$release_assets_json")"
              if [[ -z "$remote_row" ]]; then
                echo "::error::Release asset is missing or duplicated: ${asset_name}"
                return 1
              fi
              IFS=$'\t' read -r remote_state remote_size <<< "$remote_row"
              if [[ "$remote_state" != 'uploaded' || "$remote_size" != "$asset_size" ]]; then
                echo "::error::Release asset is incomplete: ${asset_name} (${remote_state}, ${remote_size}/${asset_size})"
                return 1
              fi
            done
          }

          # 单次命令建立草稿并上传所有产物，此阶段不修改正式 Release。
          gh release create "$staging_tag" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$staging_tag" \
            --notes-file "$notes_file" \
            --draft
          staging_release_id="$(release_id_for_tag "$staging_tag")"
          verify_release_assets "$staging_release_id"
          ensure_tag_ref "$staging_tag" "$GITHUB_SHA"

          old_release_exists=false
          old_release_id=''
          old_release_target=''
          old_assets_fingerprint=''
          old_release_json="$(release_json_for_tag "$RELEASE_TAG")"
          if [[ -n "$old_release_json" ]]; then
            old_release_exists=true
            old_release_id="$(jq -r '.id' <<< "$old_release_json")"
            old_release_target="$(jq -r '.target_commitish' <<< "$old_release_json")"
            old_assets_fingerprint="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${old_release_id}/assets?per_page=100" \
              | jq -Sc 'sort_by(.name) | map({name, size, state})')"
          fi

          old_tag_exists=false
          old_tag_sha=''
          if old_tag_json="$(gh api "$(tag_ref_endpoint "$RELEASE_TAG")" 2> /dev/null)"; then
            old_tag_exists=true
            old_tag_sha="$(jq -r '.object.sha' <<< "$old_tag_json")"
          fi

          backup_ready=false
          backup_sha=''
          if [[ "$old_release_exists" == 'true' ]]; then
            if [[ "$old_tag_exists" == 'true' ]]; then
              backup_sha="$old_tag_sha"
            else
              backup_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${old_release_target}" --jq '.sha')"
            fi
            ensure_tag_ref "$backup_tag" "$backup_sha"
            if ! gh release edit "$RELEASE_TAG" --tag "$backup_tag"; then
              delete_tag_ref_if_exists "$backup_tag" || true
              exit 1
            fi
            backup_ready=true
            backup_release_id="$(release_id_for_tag "$backup_tag")"
            backup_assets_fingerprint="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${backup_release_id}/assets?per_page=100" \
              | jq -Sc 'sort_by(.name) | map({name, size, state})')"
            if [[ "$backup_release_id" != "$old_release_id" \
              || "$backup_assets_fingerprint" != "$old_assets_fingerprint" ]]; then
              echo '::error::Backup release verification failed before switching.'
              gh release edit "$backup_tag" --tag "$RELEASE_TAG" || true
              delete_tag_ref_if_exists "$backup_tag" || true
              if [[ "$old_tag_exists" != 'true' ]]; then
                delete_tag_ref_if_exists "$RELEASE_TAG" || true
              fi
              exit 1
            fi
          fi

          rollback_release_switch() {
            echo 'Release switch failed; restoring the previous release state.'
            local current_release_id=''
            current_release_id="$(release_id_for_tag "$RELEASE_TAG" 2> /dev/null || true)"
            if [[ "$current_release_id" == "$staging_release_id" ]]; then
              ensure_tag_ref "$staging_tag" "$GITHUB_SHA" || true
              gh release edit "$RELEASE_TAG" --tag "$staging_tag" --draft=true \
                || echo "::error::Failed to return the new release to ${staging_tag}."
            fi

            if [[ "$old_tag_exists" == 'true' ]]; then
              ensure_tag_ref "$RELEASE_TAG" "$old_tag_sha" \
                || echo "::error::Failed to restore ${RELEASE_TAG} to ${old_tag_sha}."
            else
              delete_tag_ref_if_exists "$RELEASE_TAG" \
                || echo "::error::Failed to restore the missing ${RELEASE_TAG} tag state."
            fi

            if [[ "$backup_ready" == 'true' ]]; then
              ensure_tag_ref "$backup_tag" "$backup_sha" || true
              if gh release edit "$backup_tag" --tag "$RELEASE_TAG"; then
                delete_tag_ref_if_exists "$backup_tag" || true
              else
                echo "::error::The previous release remains available as ${backup_tag}."
              fi
              if [[ "$old_tag_exists" != 'true' ]]; then
                delete_tag_ref_if_exists "$RELEASE_TAG" || true
              fi
            fi
          }

          # staging 已完整可用，旧 Release 也已备份，此时才切换正式 tag。
          if ! ensure_tag_ref "$RELEASE_TAG" "$GITHUB_SHA"; then
            rollback_release_switch
            exit 1
          fi
          if ! gh release edit "$staging_tag" \
            --tag "$RELEASE_TAG" \
            --title "latest-commit-pre-release" \
            --notes-file "$notes_file" \
            --draft=false \
            --prerelease \
            --latest=false; then
            rollback_release_switch
            exit 1
          fi

          promoted_release_id="$(release_id_for_tag "$RELEASE_TAG" || true)"
          promoted_release_json="$(release_json_for_tag "$RELEASE_TAG" || true)"
          promoted_tag_sha="$(gh api "$(tag_ref_endpoint "$RELEASE_TAG")" --jq '.object.sha' 2> /dev/null || true)"
          if [[ "$promoted_release_id" != "$staging_release_id" \
            || "$(jq -r '.draft // true' <<< "$promoted_release_json")" != 'false' \
            || "$(jq -r '.prerelease // false' <<< "$promoted_release_json")" != 'true' \
            || "$promoted_tag_sha" != "$GITHUB_SHA" ]] \
            || ! verify_release_assets "$staging_release_id"; then
            echo '::error::Promoted pre-release verification failed.'
            rollback_release_switch
            exit 1
          fi

          # 正式 Release 已完整可用，最后才删除旧的 backup Release/tag。
          if [[ "$backup_ready" == 'true' ]]; then
            if gh release delete "$backup_tag" --yes; then
              delete_tag_ref_if_exists "$backup_tag" \
                || echo "::warning::Failed to remove backup tag ${backup_tag}."
            else
              echo "::warning::Failed to remove backup release ${backup_tag}; the new pre-release is already active."
            fi
          fi
          delete_tag_ref_if_exists "$staging_tag" \
            || echo "::warning::Failed to remove staging tag ${staging_tag}."
          echo "Pre-release updated safely with ${expected_asset_count} installer asset(s)."
