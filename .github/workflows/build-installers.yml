name: Build installers

on:
  push:
  workflow_dispatch:
    inputs:
      formal:
        description: Require signing and notarization credentials
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            edition: bundled
            platform: macos
            arch: arm64
            extension: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            edition: bundled
            platform: macos
            arch: x64
            extension: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            edition: bundled
            platform: windows
            arch: x64
            extension: exe
          - runner: macos-15
            target: aarch64-apple-darwin
            edition: lite
            platform: macos
            arch: arm64
            extension: dmg
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            edition: lite
            platform: macos
            arch: x64
            extension: dmg
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            edition: lite
            platform: windows
            arch: x64
            extension: exe
    runs-on: ${{ matrix.runner }}
    env:
      FORMAL_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.formal || false }}
      PRE_RELEASE_SUFFIX: debug
      PRE_RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install application dependencies
        run: corepack pnpm@11.7.0 install --frozen-lockfile
      - name: Import Windows signing certificate
        if: env.FORMAL_BUILD == 'true' && runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD -or !$env:WINDOWS_TIMESTAMP_URL) { throw 'Windows signing secrets are incomplete' }
          New-Item -ItemType Directory -Force -Path .build | Out-Null
          $pfx = Join-Path $env:RUNNER_TEMP 'dsh-app-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = $env:WINDOWS_TIMESTAMP_URL } } } | ConvertTo-Json -Depth 6 | Set-Content .build/windows-signing.json
      - name: Build unsigned macOS installer
        if: runner.os == 'macOS' && env.FORMAL_BUILD != 'true'
        run: node scripts/build-app.mjs --edition ${{ matrix.edition }} --target ${{ matrix.target }} --formal false --artifact-suffix "$PRE_RELEASE_SUFFIX" --artifact-commit "$PRE_RELEASE_COMMIT"
      - name: Build signed macOS installer
        if: runner.os == 'macOS' && env.FORMAL_BUILD == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/build-app.mjs --edition ${{ matrix.edition }} --target ${{ matrix.target }} --formal true --artifact-suffix "$PRE_RELEASE_SUFFIX" --artifact-commit "$PRE_RELEASE_COMMIT"
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $formal = $env:FORMAL_BUILD.ToLowerInvariant()
          $arguments = @(
            'scripts/build-app.mjs',
            '--edition', '${{ matrix.edition }}',
            '--target', '${{ matrix.target }}',
            '--formal', $formal,
            '--artifact-suffix', $env:PRE_RELEASE_SUFFIX,
            '--artifact-commit', $env:PRE_RELEASE_COMMIT
          )
          if ($formal -eq 'true') { $arguments += @('--signing-config', '.build/windows-signing.json') }
          node @arguments
      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem .build/installers -Filter 'dsh-app-${{ matrix.edition }}-*-windows-${{ matrix.arch }}_debug_*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Built Windows installer was not found' }
          node scripts/test-windows-installer.mjs --edition '${{ matrix.edition }}' --path $installer.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-app-${{ matrix.edition }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: .build/installers/dsh-app-${{ matrix.edition }}-*-${{ matrix.platform }}-${{ matrix.arch }}_debug_*.${{ matrix.extension }}
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Update pre-release
    needs: build
    # 任一 matrix 失败时仍发布其余已成功生成并上传的安装包。
    if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: latest-commit-pre-release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: latest-commit-pre-release
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check build freshness
        id: freshness
        shell: bash
        run: |
          latest_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)"
          if [[ "$latest_sha" == "$GITHUB_SHA" ]]; then
            artifact_count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name | startswith("dsh-app-"))] | length')"
            if (( artifact_count == 0 )); then
              echo "No installer artifacts were produced by this run; keeping the existing pre-release unchanged."
              exit 0
            fi
            echo "artifact_count=${artifact_count}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale build ${GITHUB_SHA}; ${DEFAULT_BRANCH} is now at ${latest_sha}."
          fi
      - name: Download installer artifacts
        if: steps.freshness.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: dsh-app-*
          path: release-assets
          merge-multiple: true
      - name: Replace pre-release
        if: steps.freshness.outputs.publish == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          expected_asset_count="${{ steps.freshness.outputs.artifact_count }}"
          if [[ ! "$expected_asset_count" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid expected installer artifact count: ${expected_asset_count}"
            exit 1
          fi
          if (( ${#assets[@]} != expected_asset_count )); then
            echo "::error::Expected ${expected_asset_count} downloaded installers, found ${#assets[@]}."
            exit 1
          fi

          declare -A current_asset_sizes=()
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || ! -s "$asset" ]]; then
              echo "::error::Installer artifact is missing or empty: ${asset}"
              exit 1
            fi
            asset_name="$(basename "$asset")"
            if [[ -n "${current_asset_sizes[$asset_name]+present}" ]]; then
              echo "::error::Duplicate installer artifact name: ${asset_name}"
              exit 1
            fi
            current_asset_sizes["$asset_name"]="$(stat --format='%s' "$asset")"
          done

          notes_file="${RUNNER_TEMP}/pre-release-notes.md"
          commit_message="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" --jq .commit.message)"
          short_sha="${GITHUB_SHA:0:7}"
          {
            printf '## 最新提交构建\n\n'
            printf '| 构建信息 | 详情 |\n'
            printf '| --- | --- |\n'
            printf '| 提交 | [`%s`](%s/%s/commit/%s) |\n' \
              "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| 工作流 | [运行 #%s · 尝试 %s](%s/%s/actions/runs/%s) |\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| 安装包 | 成功生成 %s 个 |\n\n' "${#assets[@]}"
            printf '### 提交说明\n\n'
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '> %s\n' "$line"
            done <<< "$commit_message"
            printf '\n### 构建产物\n\n'
            printf '> [!WARNING]\n'
            printf '> 这是根据最新提交自动生成的构建版本，可能不稳定、功能不完整，或包含已知及未知问题。'
            printf '请谨慎使用，不要将其用于生产环境或其他关键工作。\n\n'
            printf 'macOS 用户首次启动前请阅读 [macOS 首次启动授权指南](%s/%s/blob/%s/docs/macos-installation.zh.md)。\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '%s\n\n' '---'
            printf '## Latest commit build\n\n'
            printf '| Build | Details |\n'
            printf '| --- | --- |\n'
            printf '| Commit | [`%s`](%s/%s/commit/%s) |\n' \
              "$short_sha" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '| Workflow | [Run #%s · attempt %s](%s/%s/actions/runs/%s) |\n' \
              "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf '| Installers | %s successfully produced |\n\n' "${#assets[@]}"
            printf '### Commit message\n\n'
            while IFS= read -r line || [[ -n "$line" ]]; do
              printf '> %s\n' "$line"
            done <<< "$commit_message"
            printf '\n### Artifacts\n\n'
            printf '> [!WARNING]\n'
            printf '> This is an automatically generated build from the latest commit. '
            printf 'It may be unstable, incomplete, or contain known or unknown issues. '
            printf 'Use it with caution, and do not rely on it for production or other critical work.\n\n'
            printf 'Before opening the app for the first time on macOS, read the [macOS first-launch authorization guide](%s/%s/blob/%s/docs/macos-installation.md).\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > "$notes_file"

          tag_ref_endpoint() {
            printf 'repos/%s/git/ref/tags/%s' "$GITHUB_REPOSITORY" "$1"
          }

          tag_refs_endpoint() {
            printf 'repos/%s/git/refs/tags/%s' "$GITHUB_REPOSITORY" "$1"
          }

          ensure_tag_ref() {
            local tag="$1"
            local sha="$2"
            if gh api "$(tag_ref_endpoint "$tag")" > /dev/null 2>&1; then
              gh api --method PATCH "$(tag_refs_endpoint "$tag")" -f sha="$sha" -F force=true > /dev/null
            else
              gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${tag}" \
                -f sha="$sha" > /dev/null
            fi
          }

          delete_tag_ref_if_exists() {
            local tag="$1"
            if gh api "$(tag_ref_endpoint "$tag")" > /dev/null 2>&1; then
              gh api --method DELETE "$(tag_refs_endpoint "$tag")"
            fi
          }

          release_json_for_tag() {
            local tag="$1"
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2> /dev/null || true
          }

          wait_for_release_json() {
            local tag="$1"
            local release_json
            local attempt
            for attempt in {1..15}; do
              release_json="$(release_json_for_tag "$tag")"
              if [[ -n "$release_json" ]]; then
                printf '%s\n' "$release_json"
                return 0
              fi
              sleep 1
            done
            echo "::error::Release did not become available: ${tag}" >&2
            return 1
          }

          verify_current_assets() {
            local release_id="$1"
            local release_assets_json asset asset_name asset_size remote_row remote_state remote_size
            release_assets_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              asset_size="${current_asset_sizes[$asset_name]}"
              remote_row="$(jq -r --arg name "$asset_name" \
                '[.[] | select(.name == $name)] | if length == 1 then [.[0].state, .[0].size] | @tsv else empty end' \
                <<< "$release_assets_json")"
              if [[ -z "$remote_row" ]]; then
                echo "::error::Release asset is missing or duplicated: ${asset_name}"
                return 1
              fi
              IFS=$'\t' read -r remote_state remote_size <<< "$remote_row"
              if [[ "$remote_state" != 'uploaded' || "$remote_size" != "$asset_size" ]]; then
                echo "::error::Release asset is incomplete: ${asset_name} (${remote_state}, ${remote_size}/${asset_size})"
                return 1
              fi
            done
          }

          old_tag_exists=false
          old_tag_sha=''
          if old_tag_json="$(gh api "$(tag_ref_endpoint "$RELEASE_TAG")" 2> /dev/null)"; then
            old_tag_exists=true
            old_tag_sha="$(jq -r '.object.sha' <<< "$old_tag_json")"
          fi

          release_json="$(release_json_for_tag "$RELEASE_TAG")"
          if [[ -z "$release_json" ]]; then
            # gh 会先在内部草稿中上传全部产物，成功后才发布首次预发布版本。
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --prerelease \
              --latest=false
            release_json="$(wait_for_release_json "$RELEASE_TAG")"
          else
            # 新提交的文件名包含 commit，先与旧产物共存上传；此阶段不移动正式 tag。
            release_id="$(jq -r '.id' <<< "$release_json")"
            release_assets_json="$(gh api \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
            pending_assets=()
            for asset in "${assets[@]}"; do
              asset_name="$(basename "$asset")"
              asset_size="${current_asset_sizes[$asset_name]}"
              remote_matches="$(jq -c --arg name "$asset_name" \
                '[.[] | select(.name == $name)]' <<< "$release_assets_json")"
              remote_count="$(jq 'length' <<< "$remote_matches")"
              if (( remote_count == 0 )); then
                pending_assets+=("$asset")
              elif (( remote_count == 1 )) \
                && [[ "$(jq -r '.[0].state' <<< "$remote_matches")" == 'uploaded' ]] \
                && [[ "$(jq -r '.[0].size' <<< "$remote_matches")" == "$asset_size" ]]; then
                echo "Installer already uploaded and verified: ${asset_name}"
              else
                echo "::error::Existing release asset conflicts with the current installer: ${asset_name}"
                exit 1
              fi
            done
            if (( ${#pending_assets[@]} > 0 )); then
              gh release upload "$RELEASE_TAG" "${pending_assets[@]}"
            fi
          fi

          release_json="$(release_json_for_tag "$RELEASE_TAG")"
          release_id="$(jq -r '.id' <<< "$release_json")"
          verify_current_assets "$release_id"

          # 新产物完整可用后才切换 tag 和 Release 元数据；失败时恢复旧 tag。
          if ! ensure_tag_ref "$RELEASE_TAG" "$GITHUB_SHA" \
            || ! gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file" \
              --draft=false \
              --prerelease \
              --latest=false; then
            if [[ "$old_tag_exists" == 'true' ]]; then
              ensure_tag_ref "$RELEASE_TAG" "$old_tag_sha" || true
            else
              delete_tag_ref_if_exists "$RELEASE_TAG" || true
            fi
            echo "::error::Failed to activate the verified pre-release; the previous tag was restored."
            exit 1
          fi

          promoted_release_json="$(release_json_for_tag "$RELEASE_TAG")"
          promoted_release_id="$(jq -r '.id' <<< "$promoted_release_json")"
          promoted_tag_sha="$(gh api "$(tag_ref_endpoint "$RELEASE_TAG")" --jq '.object.sha' 2> /dev/null || true)"
          promoted_draft="$(jq -r '.draft' <<< "$promoted_release_json")"
          promoted_prerelease="$(jq -r '.prerelease' <<< "$promoted_release_json")"
          if [[ "$promoted_release_id" != "$release_id" \
            || "$promoted_draft" != 'false' \
            || "$promoted_prerelease" != 'true' \
            || "$promoted_tag_sha" != "$GITHUB_SHA" ]] \
            || ! verify_current_assets "$release_id"; then
            echo "::error::Activated pre-release verification failed: release_id=${promoted_release_id:-missing}, draft=${promoted_draft:-missing}, prerelease=${promoted_prerelease:-missing}, tag_sha=${promoted_tag_sha:-missing}."
            exit 1
          fi

          # 正式 Release 验证成功后，才删除不属于当前提交的旧产物。
          obsolete_asset_ids="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            | jq -r --argjson current_names "$(printf '%s\n' "${!current_asset_sizes[@]}" | jq -Rsc 'split("\n")[:-1]')" \
              '.[] | select((.name as $name | $current_names | index($name)) == null) | .id')"
          cleanup_failed=false
          while IFS= read -r obsolete_asset_id; do
            [[ -z "$obsolete_asset_id" ]] && continue
            removed=false
            for attempt in 1 2 3; do
              if gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${obsolete_asset_id}"; then
                removed=true
                break
              fi
              sleep "$attempt"
            done
            if [[ "$removed" != 'true' ]]; then
              cleanup_failed=true
              echo "::error::Failed to remove obsolete release asset ${obsolete_asset_id}."
            fi
          done <<< "$obsolete_asset_ids"
          if [[ "$cleanup_failed" == 'true' ]]; then
            exit 1
          fi

          final_assets_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
          final_asset_count="$(jq 'length' <<< "$final_assets_json")"
          if (( final_asset_count != expected_asset_count )) \
            || ! verify_current_assets "$release_id"; then
            echo "::error::Final pre-release contains ${final_asset_count} assets; expected ${expected_asset_count}."
            exit 1
          fi

          # 兼容清理旧实现遗留的 staging 草稿；权限受限时只告警，不影响当前发布。
          if stale_staging_releases="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" 2> /dev/null | jq -sc 'add')"; then
            while IFS=$'\t' read -r stale_release_id stale_tag; do
              if [[ -z "$stale_release_id" || -z "$stale_tag" ]]; then
                continue
              fi
              if gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/${stale_release_id}" 2> /dev/null; then
                delete_tag_ref_if_exists "$stale_tag" \
                  || echo "::warning::Failed to remove stale staging tag ${stale_tag}."
              else
                echo "::warning::Unable to remove legacy staging draft ${stale_tag}; delete it manually."
              fi
            done < <(jq -r \
              --arg prefix "${RELEASE_TAG}-staging-" \
              '.[] | select(
                .draft == true
                and (.tag_name | startswith($prefix))
              ) | [.id, .tag_name] | @tsv' \
              <<< "$stale_staging_releases")
          else
            echo '::warning::Unable to list legacy staging drafts; current pre-release is unaffected.'
          fi

          echo "Pre-release updated safely with ${expected_asset_count} installer asset(s)."
